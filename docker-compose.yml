services:
  trump:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - monitor-data:/data
    command: ["realDonaldTrump", "--interval", "60", "--state-file", "/data/truthbrush_state.json", "--max-backfill-age", "21600", "--max-posts-per-poll", "20"]
    logging:
      # Cap the json-file log so it cannot grow without bound on disk.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # Checks the liveness heartbeat, not last_check: the heartbeat is refreshed
      # even during a deliberate backoff or idle pause, so Docker does not restart
      # the container while it is intentionally waiting.
      test: ["CMD", "python", "-c", "import json, sys; from datetime import datetime, timezone, timedelta; state=json.load(open('/data/truthbrush_state.json')); hb=state.get('_heartbeat'); sys.exit(0 if hb and datetime.now(timezone.utc)-datetime.fromisoformat(hb) < timedelta(minutes=5) else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s


volumes:
  monitor-data:
