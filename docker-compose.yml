services:
  monitor:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - monitor-data:/data
    command: ["realDonaldTrump", "--interval", "60"]
    healthcheck:
      test: ["CMD", "python", "-c", "import json, sys; from datetime import datetime, timezone, timedelta; state=json.load(open('/data/truthbrush_state.json')); ts=datetime.fromisoformat(list(state.values())[0]['last_check']); sys.exit(0 if datetime.now(timezone.utc)-ts < timedelta(minutes=5) else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  monitor-data:
